spring.application.name=flashreserve

spring.datasource.url=jdbc:postgresql://localhost:5432/flashreserve
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

#Redis connection
spring.data.redis.host=localhost
spring.data.redis.port=6379

#Redis cache
spring.cache.type=redis
spring.cache.redis.time-to-live=10m
spring.cache.redis.cache-null-values=false

# Kafka connection
spring.kafka.bootstrap-servers=localhost:9092


# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer


# Consumer
spring.kafka.consumer.group-id=flashreserve-order-events
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer


# FlashReserve event topic
app.kafka.topics.order-events=order-events